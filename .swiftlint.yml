# SwiftLint configuration for the iOS app.
# Incrementally tightened — re-enable rules with reasonable thresholds.

# Lint only the app sources (avoid Pods, build output, etc.)
included:
  - Billboard/Billboard

excluded:
  - Billboard/Billboard.xcodeproj

# Start with SwiftLint defaults; opt out of a few noisy rules for existing codebases.
disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_name
  # SwiftUI tends to be closure-heavy; keep signal high.
  - multiple_closures_with_trailing_closure
  - vertical_whitespace
  - nesting
  - large_tuple

# Useful rules to keep on
opt_in_rules:
  - empty_count
  - explicit_init

# Re-enabled rules with thresholds that allow existing code to pass
# while catching truly problematic new code.

# Force unwraps and force casts — now that we've removed them, flag new ones.
# (force_cast and force_try are default-enabled once removed from disabled_rules above)

file_length:
  warning: 800
  error: 1200

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

reporter: "xcode"
